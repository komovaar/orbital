name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: worker

      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...
        working-directory: worker

      - name: go test
        run: go test ./...
        working-directory: worker

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The goldens are the specification the rewrite is measured against; a
      # change to the worker that moves them has to move them deliberately.
      - name: Replay recorded scenarios
        run: node scripts/record-scenarios.mjs --check

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r lint

      - run: pnpm -r typecheck

      - run: pnpm -r test

  tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: worker/go.mod

      # externalBin in tauri.conf.json: the Tauri build script aborts when the
      # sidecar is missing, so nothing in this job compiles without it.
      - name: Build worker sidecar
        run: node scripts/build-worker.mjs
        working-directory: apps/web

      - name: cargo fmt
        run: cargo fmt --check
        working-directory: apps/web/src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/web/src-tauri

      - name: cargo test
        run: cargo test
        working-directory: apps/web/src-tauri
